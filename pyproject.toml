[project]
name = "firstvoid-engine"
version = "0.1.0"
description = "Multi-tenant AI agent runtime for FirstVoid client chatbots"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.5",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "fastembed>=0.4.2",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "cryptography>=43.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]
# The eval harness is self-contained (app/evals) - it needs no extra packages.
# ragas and langfuse were declared here and imported nowhere; a dependency you do
# not use is a claim you cannot defend.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
